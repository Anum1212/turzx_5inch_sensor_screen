name: Build installer

# Push a tag like v1.0.0 to build the installer and attach it to a GitHub release.
# "Run workflow" (manual) builds the installer and keeps it as a downloadable build artifact only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') } else { $v = '0.0.0-dev' }
          "version=$v" >> $env:GITHUB_OUTPUT

      # Inno Setup 6 is preinstalled on windows-latest; install it if a future image drops it.
      - name: Make sure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build the installer
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version "${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: TurzxPanel-Setup-${{ steps.ver.outputs.version }}
          path: release/TurzxPanel-Setup-*.exe

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: release/TurzxPanel-Setup-*.exe
          generate_release_notes: true
